name: Build Workflow

on:
  push:
    tags:
      - '*'

jobs:
  build-windows:
    runs-on: windows-2019
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Install Python
        uses: actions/setup-python@v1
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Run PyInstaller for KeySwitchFix.py
        run: |
          python -m PyInstaller KeySwitchFix.spec

      - name: Run PyInstaller for SettingsKeySwitchFix.py
        run: |
          python -m PyInstaller SettingsKeySwitchFix.spec

      - name: Create zip file with both executables
        shell: powershell
        run: |
          Compress-Archive -Path "dist\KeySwitchFix.exe", "dist\SettingsKeySwitchFix.exe" -DestinationPath "dist\KeySwitchFix.zip"

      - name: create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false


      - name: Upload Release Asset (Zip File)
        id: upload-release-asset-zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/KeySwitchFix.zip
          asset_name: KeySwitchFix-Windows-${{ github.ref_name }}.zip
          asset_content_type: application/zip
